<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Tareas de la clase - Academia SMIF</title></head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-smif"><div class="container">
  <a class="brand" href="docente.html">S<span>M</span>IF</a>
  <div class="d-flex gap-2">
    <a href="clases.html" class="btn btn-outline-light btn-sm">← Mis clases</a>
    <button id="logoutButton" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
  </div>
</div></nav>
<main class="container my-4">
  <h1 id="tituloClase" class="h2 fw-bold mb-1">Clase</h1>
  <p id="detalleClase" class="text-muted mb-4"></p>

  <div class="card shadow-sm mb-4"><div class="card-body">
    <h2 id="formTitulo" class="h5 mb-3">Nueva tarea</h2>
    <form id="formTarea" novalidate>
      <input type="hidden" id="id">
      <div class="row g-3">
        <div class="col-md-5"><label for="titulo" class="form-label">Título</label><input id="titulo" class="form-control" maxlength="150" required></div>
        <div class="col-md-4"><label for="descripcion" class="form-label">Descripción (opcional)</label><input id="descripcion" class="form-control" maxlength="500"></div>
        <div class="col-md-3"><label for="fecha" class="form-label">Fecha límite (opcional)</label><input id="fecha" type="date" class="form-control"></div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" id="btnGuardar" class="btn btn-smif-azul">Crear tarea</button>
        <button type="button" id="btnCancelar" class="btn btn-outline-secondary hidden">Cancelar edición</button>
      </div>
    </form>
    <div id="message" class="d-none"></div>
  </div></div>

  <div class="row g-4">
    <div class="col-lg-8"><div class="card shadow-sm"><div class="card-body">
      <h2 class="h5 mb-3">Tareas</h2>
      <div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Tarea</th><th>Límite</th><th>Hechas</th><th>Acciones</th></tr></thead>
        <tbody id="tablaTareas"><tr><td colspan="4">Cargando...</td></tr></tbody>
      </table></div>
    </div></div></div>
    <div class="col-lg-4"><div class="card shadow-sm"><div class="card-body">
      <h2 class="h5 mb-3">Alumnos de la clase</h2>
      <ul id="listaAlumnos" class="list-unstyled mb-0"></ul>
    </div></div></div>
  </div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/clase.js"></script>
</body></html>
