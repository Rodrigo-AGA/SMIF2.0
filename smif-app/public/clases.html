<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Mis clases - Academia SMIF</title></head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-smif"><div class="container">
  <a class="brand" href="docente.html">S<span>M</span>IF</a>
  <div class="d-flex gap-2">
    <a href="docente.html" class="btn btn-outline-light btn-sm">Mi panel</a>
    <button id="logoutButton" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
  </div>
</div></nav>
<main class="container my-4">
  <h1 class="h2 fw-bold mb-4">Mis clases</h1>

  <div class="card shadow-sm mb-4"><div class="card-body">
    <h2 id="formTitulo" class="h5 mb-3">Crear clase</h2>
    <form id="formClase" novalidate>
      <input type="hidden" id="id">
      <div class="row g-3">
        <div class="col-md-5"><label for="nombre" class="form-label">Nombre de la clase</label><input id="nombre" class="form-control" maxlength="100" required></div>
        <div class="col-md-3"><label for="dia" class="form-label">Día</label>
          <select id="dia" class="form-select" required>
            <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
            <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="7">Domingo</option>
          </select></div>
        <div class="col-md-2"><label for="inicio" class="form-label">Hora de inicio</label><input id="inicio" type="time" class="form-control" required></div>
        <div class="col-md-2"><label for="fin" class="form-label">Hora de fin</label><input id="fin" type="time" class="form-control" required></div>
        <div class="col-12">
          <label class="form-label">Alumnos de la clase</label>
          <div id="listaAlumnos" class="border rounded p-2 bg-white" style="max-height:200px;overflow:auto"><span class="text-muted">Cargando alumnos...</span></div>
          <div class="form-text">Un alumno no puede estar en dos clases que se crucen en el mismo horario.</div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" id="btnGuardar" class="btn btn-smif-azul">Crear clase</button>
        <button type="button" id="btnCancelar" class="btn btn-outline-secondary hidden">Cancelar edición</button>
      </div>
    </form>
    <div id="message" class="d-none"></div>
  </div></div>

  <div class="card shadow-sm"><div class="card-body">
    <h2 class="h5 mb-3">Clases registradas</h2>
    <div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead><tr><th>Clase</th><th>Horario</th><th>Alumnos</th><th>Tareas</th><th>Acciones</th></tr></thead>
      <tbody id="tablaClases"><tr><td colspan="5">Cargando...</td></tr></tbody>
    </table></div>
  </div></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/clases.js"></script>
</body></html>
