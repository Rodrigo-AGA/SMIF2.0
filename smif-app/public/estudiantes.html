<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Estudiantes - Academia SMIF</title></head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-smif"><div class="container">
  <a class="brand" href="docente.html">S<span>M</span>IF</a>
  <div class="d-flex gap-2">
    <a href="docente.html" class="btn btn-outline-light btn-sm">Mi panel</a>
    <a href="cursos.html" class="btn btn-outline-light btn-sm">Cursos</a>
    <button id="logoutButton" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
  </div>
</div></nav>

<main class="container my-4">
  <h1 class="h2 fw-bold mb-4">Gestión de estudiantes</h1>

  <div class="card shadow-sm mb-4"><div class="card-body">
    <h2 id="formTitulo" class="h5 mb-3">Registrar estudiante</h2>
    <form id="formEstudiante" novalidate>
      <input type="hidden" id="id">
      <div class="row g-3">
        <div class="col-md-4">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input id="nombre" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-4">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" type="email" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-4">
          <label for="carrera" class="form-label">Carrera</label>
          <input id="carrera" class="form-control" maxlength="80" required>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" id="btnGuardar" class="btn btn-smif-azul">Registrar estudiante</button>
        <button type="button" id="btnCancelar" class="btn btn-outline-secondary hidden">Cancelar edición</button>
      </div>
    </form>
    <div id="message" class="d-none"></div>
  </div></div>

  <div class="card shadow-sm"><div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 mb-0">Estudiantes registrados</h2>
      <button id="btnActualizar" class="btn btn-outline-secondary btn-sm">Actualizar</button>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Carrera</th><th>Creado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaEstudiantes"><tr><td colspan="6">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/estudiantes.js"></script>
</body></html>
