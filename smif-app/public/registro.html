<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Registro - Academia SMIF</title></head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-smif"><div class="container">
  <a class="brand" href="index.html">S<span>M</span>IF</a>
  <a href="login.html" class="btn btn-outline-light btn-sm">Ya tengo cuenta</a>
</div></nav>
<main class="container my-4" style="max-width:720px">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 fw-bold mb-3">Crear cuenta</h1>
    <form id="registroForm" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label for="rol" class="form-label">Perfil</label>
          <select id="rol" class="form-select"><option value="alumno" selected>Estudiante</option><option value="docente">Profesor</option></select>
        </div>
        <div class="col-md-6"><label for="nombre" class="form-label">Nombres</label><input id="nombre" class="form-control" maxlength="80" required></div>
        <div class="col-md-6"><label for="apellidos" class="form-label">Apellidos</label><input id="apellidos" class="form-control" maxlength="80" required></div>
        <div class="col-md-4"><label for="dni" class="form-label">DNI</label><input id="dni" class="form-control" inputmode="numeric" maxlength="8" required></div>
        <div class="col-md-4"><label for="celular" class="form-label">Celular</label><input id="celular" class="form-control" inputmode="numeric" maxlength="9" placeholder="9XXXXXXXX" required></div>
        <div class="col-md-4"><label for="email" class="form-label">Correo</label><input id="email" type="email" class="form-control" maxlength="100" required></div>
        <div class="col-12"><label for="password" class="form-label">Contraseña</label><input id="password" type="password" class="form-control" maxlength="72" autocomplete="new-password" required><div class="form-text">Mínimo 8 caracteres, con letras y números.</div></div>

        <div class="col-md-6 solo-alumno"><label for="ciclo" class="form-label">Ciclo</label><input id="ciclo" class="form-control" maxlength="30" placeholder="Ciclo 1"></div>
        <div class="col-md-6 solo-alumno"><label for="modalidad" class="form-label">Modalidad</label>
          <select id="modalidad" class="form-select"><option value="presencial">Presencial</option><option value="virtual">Virtual</option><option value="híbrida">Híbrida</option></select></div>

        <div class="col-md-6 solo-docente hidden"><label for="especialidad" class="form-label">Especialidad</label><input id="especialidad" class="form-control" maxlength="80"></div>
        <div class="col-md-6 solo-docente hidden"><label for="claveSecretaria" class="form-label">Clave de secretaría</label><input id="claveSecretaria" type="password" class="form-control" autocomplete="off"><div class="form-text">La entrega la secretaría de la academia.</div></div>
      </div>
      <button type="submit" class="btn btn-smif-azul mt-4 px-4">Registrarme</button>
    </form>
    <div id="message" class="d-none"></div>
  </div></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/registro.js"></script>
</body></html>
